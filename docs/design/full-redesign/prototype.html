pleapp{border:1px solid var(--line);border-radius:16px;padding:20px;--tool-color:var(--blue)}.sampleapp button.primary{background:var(--tool-color);border-color:var(--tool-color)}.summaryvalue{font-size:2.2rem;letter-spacing:-.04em;font-weight:650;line-height:1.2}.expense{display:flex;gap:12px;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.expense:last-child{border:0}.toolnav{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.toolnav button[aria-pressed=true]{color:var(--blue);background:var(--tint)}.overlay{position:fixed;inset:0;background:#17203366;display:flex;justify-content:center;align-items:center;padding:24px;z-index:10}.dialog{background:var(--surface);border-radius:20px;width:100%;max-width:580px;max-height:calc(100dvh - 48px);overflow:auto;box-shadow:0 20px 80px #17203322}.dialogheader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}.dialogbody{padding:24px}.dialogbody>.stack>button{text-align:left}.pickergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pickergrid button{overflow-wrap:anywhere}.pickergrid button[aria-pressed=true]{color:var(--blue);border-color:var(--blue);background:var(--tint)}.historyrow{padding:14px 0;border-bottom:1px solid var(--line)}.historyrow p{margin:6px 0}.progress{background:var(--tint);height:6px;border-radius:3px;margin:14px 0}.progress span{display:block;background:var(--blue);width:40%;height:100%;border-radius:3px}.mobile-nav{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:12px;padding:14px 20px;max-width:calc(100vw - 32px);z-index:20;line-height:1.5}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}details{padding:14px 0}summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:550;gap:10px}summary:before{content:'+';color:var(--muted)}detail @media(min-width:1200px){.workspace.split{grid-template-columns:minmax(360px,.9fr) minmax(0,1.1fr)}.chatpane,.outputpane{padding:32px 40px}.content{padding-top:40px}}
@media(max-width:900px){.shell{grid-template-columns:170px minmax(0,1fr)}.sidebar{padding:20px 10px}.brand{padding:4px;margin-bottom:16px}.workspace.split{display:block}.workspace.split .chatpane{display:none}.workspace.split .outputpane{border:0}.appgrid{grid-template-columns:1fr}.topbar{padding:16px 24px}.content{padding:28px 24px 48px}.tabs{padding-left:24px;padding-right:24px}}

.workstrip>.grow{flex-basis:180px}
@media(max-width:620px){.tabs{padding-inline:8px}.tabs button{padding-inline:4px;flex:1 1 auto}.topbar h2{max-width:100%}}
.plan-actions{position:sticky;bottom:0;background:var(--surface);padding:16px 0;border-top:1px solid var(--line);z-index:1}

<body>
<div class="reviewbar">
 <span><strong>Design prototype</strong> · Sample data and simulated AI · Nothing is sent or downloaded</span>
 <div class="row gap8"><label for="scenario">Explore <select id="scenario"><option value="library">Everyday use</option><option value="first">First visit</option><option value="draft">Draft project</option><option value="review">Pending edit</option><option value="failure">Failed build</option><option value="setup">No AI configured</option></select></label><label><input id="large" type="checkbox"> Larger text</label></div>
</div>
<div id="app"></div>
<div id="modal"></div>
<div id="announcement" class="sr" aria-live="polite"></div>
<script>
'use strict';
const icons={apps:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 19 0Z"/><path d="M7 8h10M7 12h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m14 5-7 7 7 7M7 12h14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 1 3h4l1-3 3-1 2-3-2-2 1-3-3-2-1-3Z"/>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',arrow:'<path d="m9 5 7 7-7 7"/>',send:'<path d="m12 4-7 7M12 4l7 7M12 4v16"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M16 11h5v5h-5Z"/>',note:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',check:'<path d="m5 12 4 4L19 6"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>',edit:'<path d="m14 5 5 5M4 20l4-1L21 6l-4-4L4 15Z"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>'};
const ico=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[n]||icons.apps)+'</svg>';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,action,style='',extra='')=>`<button type="button" class="${style}" data-action="${action}" ${extra}>${text}</button>`;
const field=(label,name,value='',type='text',hint='')=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''}>${hint?`<span class="hint">${hint}</span>`:''}</div>`;
const textfield=(label,name,value='',rows=3)=>`<div class="field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" rows="${rows}">${esc(value)}</textarea></div>`;
const features=()=>[{title:'Record an expense',workflow:'Add an amount and category, then save it on your phone.',checks:['Saving 12 adds one expense with amount 12.']},{title:'See remaining budget',workflow:'Subtract total spending from the trip budget.',checks:['A budget of 300 and spending of 42 shows 258 remaining.']},{title:'Find earlier expenses',workflow:'Browse or search your saved expenses.',checks:['Searching Food shows only matching expenses.']}];
const state={route:'apps',tab:'chat',projectId:'trip',settings:'root',from:'apps',empty:false,search:'',searchOpen:false,toolTab:'overview',job:null,followup:'',queue:[],connection:'local',localModel:'Qwen3 1.7B · Q8_0',keySaved:false,cloudModel:'Gemini 2.5 Flash',operation:null,review:false,suggestion:false,expenseError:'',previewRecords:null,previewNote:false,
 projects:[{id:'trip',name:'Trip budget',goal:'Keep track of spending while you travel.',kind:'native',status:'ready',icon:'wallet',features:features(),screens:['Overview','Expenses'],data:['Expenses'],answers:['Track daily spending, not shared costs.'],draft:'',messages:[{role:'user',text:'Build a simple budget for my trip. I want to track food and transport.'},{role:'assistant',text:'Your trip budget is ready. You can add expenses and see what is left. What would you like to change?'}],records:[{name:'Lunch',category:'Food',amount:28},{name:'Train ticket',category:'Transport',amount:14}],budget:300,note:false,versions:['Added expense search','Initial app'],appearance:{layout:'Simple List',palette:'Ocean',icon:'Travel',tabs:['Home','Expenses']}},
 {id:'notes',name:'Study notes',goal:'A quiet place for your class notes.',kind:'html',status:'ready',icon:'note',features:[{title:'Write and find notes',workflow:'Save, edit and search entries on this phone.',checks:['A saved note is searchable.']}],screens:['Notes'],data:['Notes'],answers:[],draft:'',messages:[{role:'assistant',text:'Your offline notes starter is ready. Its saved HTML app stays available while you change the next build.'}],records:[],versions:[],appearance:{layout:'Simple List',palette:'Ocean',icon:'Book',tabs:['Notes']}},
 {id:'routine',name:'Daily routine',goal:'Build a small checklist for a calmer morning.',kind:'native',status:'draft',icon:'check',features:[{title:'Make a morning checklist',workflow:'Add a task and mark it complete.',checks:['Completing a task keeps it checked on reopening.']},{title:'Keep tasks on this phone',workflow:'Save your list for the next day.',checks:['A saved task appears after closing the app.']}],screens:['Today'],data:['Tasks'],answers:['Start with the morning.'],draft:'',messages:[{role:'user',text:'I want a simple morning routine checklist.'},{role:'assistant',text:'I have drafted a checklist with saved tasks. I assumed tasks stay on your list until you remove them. You can change that before building.'}],records:[],versions:[],appearance:{layout:'Simple List',palette:'Ocean',icon:'Tasks',tabs:['Today']}}],
 chats:[{id:'general',name:'Planning a productive week',draft:'',messages:[{role:'user',text:'Help me make room for study and exercise this week.'},{role:'assistant',text:'Let’s start with the commitments that have fixed times. What do you already have booked?'}]}],chatId:'general',guided:{name:'My tracker',fields:[{name:'Item',type:'Text'},{name:'Amount',type:'Number'}],records:true,search:true,calculation:'None'},newDraft:'',appearanceDraft:null};
const app=document.getElementById('app'),modal=document.getElementById('modal');let returnFocus=null,toastTimer;
const project=()=>state.projects.find(p=>p.id===state.projectId);
function announce(t){document.getElementById('announcement').textContent=t;}
function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),4000);}
function go(route){closeDialog();state.route=route;state.search='';state.expenseError='';render();window.scrollTo(0,0);}
function openProject(id,tab='chat'){state.projectId=id;state.tab=tab;state.previewRecords=null;go('workspace');}
function badge(p){return `<span class="badge ${p.status==='ready'?'green':''}">${p.status==='ready'?'Ready to use':'Draft'}</span>`;}
function header(title,subtitle=''){let root=['apps','chats'].includes(state.route);return `<header class="topbar"><div class="breadcrumb">${root?'':btn(ico('back'),'back','icon quiet','aria-label="Back"')}<div><h2 class="${root?'root-title':''}">${esc(title)}</h2>${subtitle?`<span class="caption muted">${esc(subtitle)}</span>`:''}</div></div><div class="row gap8">${btn(ico('activity')+(state.job||state.review?' <span class="badge">1</span>':''),'activity','quiet','aria-label="Activity'+(state.job||state.review?', 1 item':'')+'"')}${state.route==='workspace'?btn(ico('more'),'menu','icon quiet','aria-label="Project options"'):root?btn(ico('settings'),'settings','icon quiet','aria-label="Settings"'):''}</div></header>`;}
function shell(content){const root=state.route==='chats'||state.route==='general'?'chats':'apps';return `<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">${ico('apps')}</span>BuildAI</div>${btn(ico('apps')+'Apps','apps',root==='apps'?'selected':'')}${btn(ico('chat')+'Chats','chats',root==='chats'?'selected':'')}<div class="spacer"></div>${btn(ico('activity')+'Activity','activity')}${btn(ico('settings')+'Settings','settings')}<div class="aside-note">Your saved tools remain available without an AI connection.</div></aside><main class="main">${content}</main></div>${['apps','chats'].includes(state.route)?`<nav class="mobile-nav" aria-label="Main navigation">${btn(ico('apps')+'Apps','apps',root==='apps'?'selected':'',`aria-current="${root==='apps'?'page':'false'}"`)}${btn(ico('chat')+'Chats','chats',root==='chats'?'selected':'',`aria-current="${root==='chats'?'page':'false'}"`)}</nav>`:''}<footer class="simulation"><span class="caption muted">Prototype controls · AI, job results and settings below are simulated.</span><div class="row gap8">${state.job?btn('Finish simulated work','finish')+btn('Fail simulated work','fail'):state.operation?btn('Finish simulated operation','finish-operation'):btn('Reset sample data','reset','quiet')}</div></footer>`;}
function library(){const ps=state.empty?[]:state.projects.filter(p=>(p.name+' '+p.goal).toLowerCase().includes(state.search.toLowerCase()));return header('BuildAI')+`<section class="content"><div class="pageintro row between"><div><h1>Apps</h1><p class="muted mt" style="margin-top:10px">Useful tools, made for you.</p></div>${btn(ico('plus')+' Create app','create','primary')}</div>${state.job?workstrip():''}${state.searchOpen?`<div class="field"><label for="app-search">Find an app or draft</label><div class="row"><input id="app-search" class="grow" value="${esc(state.search)}" placeholder="Search your apps">${btn('Clear','clear-search','quiet')}</div></div>`:state.empty?'':`<div class="row end mb">${btn(ico('search')+' Search','search','quiet')}</div>`}<div id="library-list">${libraryItems(ps)}</div></section>`;}
function libraryItems(ps){let ready=ps.filter(p=>p.status==='ready'),drafts=ps.filter(p=>p.status!=='ready');return ps.length?`${ready.length?`<div class="appgrid">${ready.map(p=>`<article class="appcard"><button class="app-open" data-action="open" data-id="${p.id}" aria-label="Open ${esc(p.name)}"><span class="avatar">${ico(p.icon)}</span><span><h2>${esc(p.name)}</h2><span class="caption muted">${p.kind==='html'?'Saved web app':'Personal app'}</span></span></button><p class="muted">${esc(p.goal)}</p><div class="cardfoot row between">${badge(p)}<div class="row gap8">${btn('Edit','edit','quiet',`data-id="${p.id}" aria-label="Edit ${esc(p.name)}"`)}${btn(ico('more'),'cardmenu','icon quiet',`data-id="${p.id}" aria-label="Options for ${esc(p.name)}"`)}</div></div></article>`).join('')}</div>`:''}${drafts.length?`<h2 class="mt">Drafts</h2>${drafts.map(p=>`<div class="listrow"><button class="openrow" data-action="edit" data-id="${p.id}"><span class="avatar">${ico(p.icon)}</span><span class="grow"><h3>${esc(p.name)}</h3><span class="caption muted">${esc(p.goal)}</span></span>${ico('arrow')}</button></div>`).join('')}`:''}`:`<div class="empty"><div class="avatar">${ico(state.search?'search':'apps')}</div><h2>${state.search?'No apps match that search':'Your first useful tool starts here'}</h2><p>${state.search?'Try a different name or clear the search.':'Describe something that would make your day easier, or start with a simple manual tool.'}</p>${btn(state.search?'Clear search':'Create an app',state.search?'clear-search':'create','primary')}${!state.search?btn('Build manually','guided','quiet full mt'):''}</div>`;}
function chats(){return header('BuildAI')+`<section class="content narrow"><div class="row between mb"><h1>Chats</h1>${btn(ico('plus')+' New chat','new-chat','primary')}</div><p class="muted">Ask a question or think something through.</p>${state.chats.map(c=>`<div class="listrow"><button class="openrow" data-action="chat-open" data-id="${c.id}"><span class="avatar">${ico('chat')}</span><span class="grow"><h3>${esc(c.name)}</h3><span class="caption muted">${esc(c.messages.at(-1)?.text||'New conversation')}</span></span>${ico('arrow')}</button>${btn(ico('more'),'chat-menu','icon quiet',`data-id="${c.id}" aria-label="Options for ${esc(c.name)}"`)}</div>`).join('')}</section>`;}
function composer(draft,context){return `<form class="composer" data-form="${context}"><label class="sr" for="draft-${context}">${context==='new'?'Describe your app':'Message BuildAI'}</label><textarea id="draft-${context}" name="message" data-draft="${context}" placeholder="${context==='new'?'An app that helps me…':'Add an idea or describe a change…'}">${esc(draft)}</textarea><div class="composerfoot">${btn(ico('shield')+' '+(state.connection==='local'?'Local AI':'Cloud AI'),'connection','quiet connection')}<div class="row gap8">${btn(ico('mic'),'voice','icon quiet','aria-label="Dictate a message"')}<button type="submit" class="primary" aria-label="${context==='new'?'Create draft':state.job?.projectId===state.projectId&&context==='project'?'Queue message':'Send message'}">${ico('send')} ${context==='new'?'Start':state.job?.projectId===state.projectId&&context==='project'?'Queue':'Send'}</button></div></div></form>`;}
function create(){return header('Create app')+`<section class="content narrow"><span class="eyebrow">Start with what you need</span><h1 class="mt">What would you like your app to do?</h1><p class="muted mt">Describe it in your own words. You can shape the plan before anything is built.</p>${composer(state.newDraft,'new')}<div class="row between mt">${btn('Build manually','guided','quiet')}${btn('Use a starter','starters','quiet')}</div><hr class="divider"><span class="eyebrow">A few starting points</span><div class="stack mt">${[['A trip budget','Track what I spend on a trip and show what is left.','wallet'],['Study notes','Save my study notes and find them later.','note'],['A daily checklist','Help me build a checklist for my morning routine.','check']].map(([n,t,i])=>btn(`<span class="avatar">${ico(i)}</span><span>${n}<span class="caption muted" style="display:block;margin-top:4px">${t}</span></span>`,'example','example',`data-text="${esc(t)}"`)).join('')}</div></section>`;}
function workstrip(projectOnly=false){return !state.job||projectOnly&&state.job.projectId!==state.projectId?'':`<aside class="workstrip ${state.job.status==='failed'?'failed':''}" aria-label="Project work"><span>${ico('activity')}</span><div class="grow"><strong>${esc(state.projects.find(p=>p.id===state.job.projectId)?.name||'Project')} · ${state.job.status==='failed'?'Needs attention':state.job.type==='edit'?'Preparing change':'Building'}</strong><p class="caption muted">${state.job.status==='failed'?'Your draft and last working app are retained.':'You can leave this screen. Your work continues.'}</p></div>${btn(state.job.status==='failed'?'Retry':'Details',state.job.status==='failed'?'retry':'activity','quiet')}</aside>`;}
function messages(items){return items.map(m=>`<div class="message ${m.role}">${m.role==='assistant'?'<div class="eyebrow">BuildAI</div>':''}<p>${esc(m.text)}</p></div>`).join('');}
function chatpane(p){return `<section class="chatpane" aria-label="Project conversation">${messages(p.messages)}${p.status==='draft'?`<div class="planlink"><div class="row between"><strong>Your plan is ready to shape</strong><span class="badge">${p.features.length} features</span></div><p class="caption muted">Review the details and assumptions before building.</p>${btn('Review plan','tab-plan','primary')}</div>`:''}${state.review&&p.id==='trip'?`<div class="planlink"><strong>Your change is ready to review</strong><p class="caption muted">Adds an optional note to each expense. Your current app is unchanged.</p>${btn('Review change','review','primary')}</div>`:''}${state.job&&state.job.projectId===p.id?`<div class="row">${btn('Stop '+(state.job.type==='edit'?'change':'build'),'stop','quiet danger')}${btn(`${state.queue.length} queued request${state.queue.length===1?'':'s'}`,'queue','quiet')}</div>`:''}${composer(p.draft,'project')}${p.status==='ready'&&p.kind==='native'?`<div class="row gap8"><span class="caption muted">Change on</span>${btn(state.scope||'Expenses','scope','small quiet')}</div>`:''}</section>`;}
function planpane(p){return `<section class="outputpane" aria-label="App plan"><div class="row between mb"><h2>${esc(p.name)}</h2>${btn('Edit details','plan-details','quiet')}</div><p class="muted">${esc(p.goal)}</p><div class="row between"><span class="eyebrow">What your app will do</span><span class="caption muted">${p.features.length} features planned</span></div>${p.features.map((f,i)=>`<article class="feature"><div class="row"><span class="feature-num">${i+1}</span><h3 class="grow">${esc(f.title)}</h3>${btn(ico('edit'),'feature','icon quiet',`data-index="${i}" aria-label="Edit feature ${esc(f.title)}"`)}</div><p>${esc(f.workflow)}</p><details><summary class="caption">How we’ll check it</summary>${f.checks.map(c=>`<p class="caption">${esc(c)}</p>`).join('')}</details></article>`).join('')}${btn(ico('plus')+' Add feature','add-feature','quiet mt',p.features.length>=12?'disabled':'')}<div class="callout"><strong>Assumption to review</strong><p>Records stay on this phone until you remove them. AI requests use your selected connection.</p></div><details><summary>Screens & saved data</summary><p class="caption muted">${esc(p.screens.join(' · '))}<br>Saved: ${esc(p.data.join(' · ')||'No records')}</p>${btn('Edit screens & data','screens','quiet')}</details><details><summary>Remembered answers</summary><p class="caption muted">${esc(p.answers.join(' ')||'No saved answers yet.')}</p></details>${p.status==='draft'?`<details><summary>Optional additions</summary><label class="checkrow"><input type="checkbox" id="suggestion" ${state.suggestion?'checked':''}> Add an optional note to each item</label>${btn('Update plan','suggestion','quiet')}</details>`:''}<div class="row mt">${p.kind==='html'?btn('Appearance','appearance','quiet'):''}${btn('Build manually','guided','quiet')}</div><div class="actionbar">${p.status==='draft'?btn('Build app','build','primary',state.job?'disabled':''):btn('Open app','open-current','primary')}${btn('Add an idea','tab-chat','quiet')}</div><p class="caption muted mt">Planned checks become results only after verification. A model’s reply test does not qualify it to build apps.</p></section>`;}
function previewpane(p){return `<section class="outputpane"><div class="row between mb"><h2>Preview</h2>${p.status==='ready'?btn('Open app','open-current','quiet'):''}</div>${p.status==='draft'?`<div class="empty"><div class="avatar">${ico('apps')}</div><h2>Your app will appear here</h2><p>Review your plan, then build. This space will show a runnable result.</p>${btn('Review plan','tab-plan','primary')}</div>`:`<div class="previewlabel">${state.review&&p.id==='trip'?'Unapplied change · Isolated sample data':'Sample app · Prototype data only'}</div>${sampleApp(p,true)}<div class="actionbar">${state.review&&p.id==='trip'?btn('Review & apply change','review','primary'):btn('Describe a change','tab-chat','primary')}${p.kind==='html'?btn('Appearance','appearance','quiet'):''}</div>`}</section>`;}
function workspace(){const p=project();return header(p.name,p.status==='ready'?'Your app workspace':'Draft · saved')+workstrip(true)+`<div class="tabs" role="tablist" aria-label="Project workspace">${['chat','plan','preview'].map(t=>`<button id="tab-${t}" type="button" role="tab" aria-selected="${state.tab===t}" aria-controls="workspace-panel" data-action="tab-${t}">${t[0].toUpperCase()+t.slice(1)}${t==='preview'&&state.review&&p.id==='trip'?' •':''}</button>`).join('')}</div><div id="workspace-panel" role="tabpanel" aria-labelledby="tab-${state.tab}" class="workspace ${state.tab!=='chat'?'split':''}">${chatpane(p)}${state.tab==='plan'?planpane(p):state.tab==='preview'?previewpane(p):''}</div>`;}
function general(){const c=state.chats.find(c=>c.id===state.chatId);return header(c.name)+`<div class="content narrow"><div class="stack">${messages(c.messages)}</div>${composer(c.draft,'general')}</div>`;}
function sampleApp(p,preview){if(p.kind==='html')return `<div class="sampleapp"><div class="row between mb"><h2>${esc(p.name)}</h2><span class="badge">Web app</span></div><form data-form="note"><div class="field"><label for="study-note">Write a note</label><textarea id="study-note" name="note" rows="4" required placeholder="A thought worth keeping…"></textarea></div><button class="primary" type="submit">Save note</button></form><h3 class="mt">Your notes</h3>${(preview?state.previewRecords??p.records:p.records).map(r=>`<p class="mt">${esc(r.name)}</p>`).join('')||'<p class="muted mt">No saved notes yet.</p>'}</div>`;
 const records=preview?(state.previewRecords??=p.records.map(r=>({...r}))):p.records;const spent=records.reduce((s,r)=>s+r.amount,0);return `<div class="sampleapp"><div class="row between mb"><h2>${esc(p.name)}</h2>${!preview?'<span class="caption muted">Saved on this phone</span>':''}</div><nav class="toolnav" aria-label="App screens">${btn('Overview','tool-overview','',`aria-pressed="${state.toolTab==='overview'}"`)}${btn('Expenses','tool-expenses','',`aria-pressed="${state.toolTab==='expenses'}"`)}</nav>${state.toolTab==='overview'?`<div class="callout"><span class="caption muted">Remaining budget</span><div class="summaryvalue">${(p.budget-spent).toFixed(0)}</div><span class="caption muted">${spent.toFixed(0)} spent of ${p.budget}</span></div>`:''}<form data-form="expense"><div class="row"><div class="grow">${field('What was it?','expense','', 'text')}</div><div style="flex:0 1 120px">${field('Amount','amount','','number')}</div></div><div class="field"><label for="category">Category</label><select name="category" id="category"><option>Food</option><option>Transport</option><option>Other</option></select></div>${p.note||preview&&state.review?field('Optional note','record-note'):''}${state.expenseError?`<p role="alert" style="color:var(--red)">${esc(state.expenseError)}</p>`:''}<button type="submit" class="primary full">Add expense</button></form><h3 class="mt">Recent expenses</h3>${records.map((r,i)=>`<div class="expense"><div class="grow"><strong>${esc(r.name)}</strong><div class="caption muted">${esc(r.category)}${r.note?' · '+esc(r.note):''}</div></div><strong>${r.amount.toFixed(0)}</strong>${btn(ico('more'),'expense-menu','icon quiet',`data-index="${i}" data-preview="${preview}" aria-label="Options for ${esc(r.name)}"`)}</div>`).join('')||'<p class="muted mt">No expenses yet. Add your first above.</p>'}</div>`;}
function runner(){const p=project();return header(p.name,'App use · sample data')+`<section class="content narrow">${sampleApp(p,false)}<p class="caption muted mt">This prototype saves sample entries in memory. Close returns to the same workspace.</p></section>`;}
function guided(){const g=state.guided;return header('Build manually','No AI connection needed')+`<section class="content narrow"><h1>A simple tool, your way</h1><p class="muted mt">Choose your inputs, optional calculation and saved records.</p><form data-form="guided">${field('App name','guided-name',g.name)}<h2 class="mb">Inputs</h2>${g.fields.map((f,i)=>`<div class="row"><div class="grow">${field('Field name','guided-field-'+i,f.name)}</div><span class="badge">${f.type}</span>${btn('Remove','remove-field','quiet danger',`data-index="${i}" ${g.fields.length===1?'disabled':''}`)}</div>`).join('')}<div class="chips mb">${['Text','Number','Boolean','Date'].map(t=>btn(ico('plus')+' '+t,'add-field','small',`data-type="${t}" ${g.fields.length>=12?'disabled':''}`)).join('')}</div><label class="checkrow"><input name="save-records" type="checkbox" ${g.records?'checked':''}> Save records on this device</label><label class="checkrow"><input name="search-records" type="checkbox" ${g.search?'checked':''}> Include record search</label><details><summary>Add a calculation</summary><div class="field"><label for="calc">Calculation</label><select id="calc" name="calculation">${['None','Add','Subtract','Multiply','Divide'].map(t=>`<option ${t===g.calculation?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="operand1">First number field</label><select name="operand1" id="operand1">${g.fields.filter(f=>f.type==='Number').map(f=>`<option>${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label for="operand2">Second number field</label><select name="operand2" id="operand2">${g.fields.filter(f=>f.type==='Number').map(f=>`<option>${esc(f.name)}</option>`).join('')}</select></div>${field('Result label','result-label','Result')}</details><p class="caption muted mt">The Android guided builder validates these choices before publishing. The prototype opens a demonstration plan.</p><button type="submit" class="primary full">Create manual draft</button></form></section>`;}
function settings(){if(state.settings==='root')return header('Settings')+`<section class="content narrow"><h1>Settings</h1><div class="settingsrow">${btn(`<span class="avatar">${ico('shield')}</span><span class="grow"><strong>AI & privacy</strong><span class="caption muted">${state.connection==='local'?'Local AI':'Cloud AI'} · ${state.connection==='local'?(state.localModel?'Model installed':'Setup needed'):(state.keySaved?'Key saved':'Setup needed')}</span></span>${ico('arrow')}`,'settings-ai')}</div><div class="settingsrow">${btn(`<span class="avatar">${ico('apps')}</span><span class="grow"><strong>About BuildAI</strong><span class="caption muted">App information and design limits</span></span>${ico('arrow')}`,'about')}</div><p class="muted caption mt">Project appearance, versions and sharing live inside each app’s workspace.</p></section>`;
 if(state.settings==='ai')return header('AI & privacy')+`<section class="content narrow"><h1>Where should the assistant work?</h1><p class="muted mt">Your saved apps run without AI. Choose a connection for future replies and builds.</p><div class="settingsrow">${btn(`<span class="avatar">${ico('shield')}</span><span class="grow"><strong>Local AI</strong><span class="caption muted">Runs on this phone · ${state.localModel?'Model installed':'Setup needed'}</span></span>${state.connection==='local'?'<span class="badge">Selected</span>':ico('arrow')}`,'settings-local')}</div><div class="settingsrow">${btn(`<span class="avatar">${ico('chat')}</span><span class="grow"><strong>Cloud AI · Gemini</strong><span class="caption muted">Sends requests to Google · ${state.keySaved?'Key saved':'Add your API key'}</span></span>${state.connection==='cloud'?'<span class="badge">Selected</span>':ico('arrow')}`,'settings-cloud')}</div><div class="callout"><strong>Your choice stays your choice</strong><p>Installing or removing a model does not switch your AI connection. Running work keeps the connection it started with.</p></div></section>`;
 if(state.settings==='local')return header('Local AI')+`<section class="content narrow"><h1>AI on your phone</h1><p class="muted mt">Local requests stay on this device. Available models have different download sizes and reliability limits.</p><div class="callout"><strong>${esc(state.localModel||'No model installed')}</strong><p>${state.localModel?'Installed does not mean qualified for app building.':'You can choose Local AI now and complete setup later.'}</p></div>${btn(state.connection==='local'?'Local AI selected':'Use local AI','use-local','primary full',state.connection==='local'?'disabled':'')}<div class="row mt">${btn('Browse models','catalog')}${btn('Import model file','import-model')}${state.localModel?btn('Reply test','test-model')+btn('Remove model','remove-model','quiet danger'):''}</div>${state.operation?`<div class="callout mt"><strong>${esc(state.operation)}</strong><p>Simulated operation. Use the prototype control below to finish, or cancel.</p>${btn('Cancel operation','cancel-operation','quiet danger')}</div>`:''}<details class="mt"><summary>What the reply test checks</summary><p class="caption muted">A short model response and its elapsed time. It does not check that the model can build a reliable app.</p></details></section>`;
 return header('Cloud AI · Gemini')+`<section class="content narrow"><h1>A connection you control</h1><p class="muted mt">Future cloud requests use Google’s API. Your key is stored securely in the Android app.</p><form data-form="key"><div class="field"><label for="demo-key">Demo API key — do not enter a real key</label><div class="row"><input class="grow" name="key" id="demo-key" type="password" placeholder="Use any sample text" autocomplete="off">${btn('Show','show-key','quiet')}</div><span class="hint">Prototype only. No key value is retained or transmitted.</span></div><button type="submit" class="primary">Save demo key</button>${state.keySaved?btn('Remove key','remove-key','quiet danger'):''}</form><p class="caption muted mt">${state.keySaved?'Demo key saved · connection has not been verified.':'Cloud setup needs a key. Local AI and saved apps remain available.'}</p>${btn(state.connection==='cloud'?'Cloud AI selected':'Use cloud AI','use-cloud','full',state.connection==='cloud'?'disabled':'')}<div class="field mt"><label for="cloud-model">Planning model</label><select id="cloud-model">${['Gemma 4 31B','Gemma 4 26B MoE','Gemini 2.5 Flash-Lite','Gemini 2.5 Flash'].map(m=>`<option ${m===state.cloudModel?'selected':''}>${m}</option>`).join('')}</select><span class="hint">Selection applies immediately to future planning requests.</span></div><details><summary>Generation details</summary><p class="caption muted">The existing HTML generation path tries Flash-Lite, Flash, then Gemma. Actual provider/model belongs in each job’s details.</p></details><a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer">Get a key from Google AI Studio</a></section>`;}
function activity(){return header('Activity','Work continues when you leave')+`<section class="content narrow"><h1>Activity</h1>${state.review?`<h2 class="mt">Needs attention</h2><div class="listrow"><span class="avatar">${ico('edit')}</span><div class="grow"><h3>Trip budget</h3><span class="caption muted">Optional expense note · ready to review</span></div>${btn('Review','review','primary')}</div>`:''}${state.job?`<h2 class="mt">${state.job.status==='failed'?'Needs attention':'Running'}</h2><div class="listrow"><span class="avatar">${ico('activity')}</span><div class="grow"><h3>${esc(state.projects.find(p=>p.id===state.job.projectId)?.name||'Project')}</h3><span class="caption muted">${state.job.type==='edit'?'Preparing an edit':'Building the plan'} · ${state.job.status==='failed'?'Failed':'In progress'}</span></div></div><p class="muted mt">${state.job.status==='failed'?'The simulated check failed. Your draft, records and last working app were kept.':'Preparing and checking the requested output. There is no reliable time estimate.'}</p><div class="row">${btn('Open project','job-project')}${btn(state.job.status==='failed'?'Retry':'Stop',state.job.status==='failed'?'retry':'stop',state.job.status==='failed'?'primary':'quiet danger')}</div><details class="mt"><summary>Work details</summary><p class="caption">Connection at start: ${esc(state.job.connection)}<br>Result: ${state.job.status==='failed'?'Simulated verification failure':'Awaiting simulation outcome'}<br>Queued requests: ${state.queue.length}</p></details>`:!state.review?`<div class="empty"><div class="avatar">${ico('check')}</div><h2>You’re all caught up</h2><p>Replies, builds and model operations appear here while they run.</p>${btn('Back to apps','apps','primary')}</div>`:''}<details class="mt"><summary>Recent work</summary><div class="historyrow"><strong>Trip budget · initial app</strong><p class="caption muted">Completed · sample history</p>${btn('Open project','edit','quiet','data-id="trip"')}</div></details></section>`;}
function render(){const content={apps:library,chats,new:create,workspace,general,runner,guided,settings,activity}[state.route]||library;app.innerHTML=shell(content());app.querySelector('.outputpane[aria-label="App plan"] .actionbar')?.classList.add('plan-actions');}
function dialog(title,body){returnFocus=document.activeElement;modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialogheader"><h2 id="dialog-title">${esc(title)}</h2>${btn(ico('close'),'close-dialog','icon quiet','aria-label="Close dialog"')}</header><div class="dialogbody">${body}</div></section></div>`;modal.querySelector('button,input,textarea,select')?.focus();}
function closeDialog(){modal.innerHTML='';if(returnFocus?.isConnected)returnFocus.focus();returnFocus=null;}
function menu(p){dialog(p.name,`<div class="stack">${btn('Rename','rename')}${btn('Version history','history',p.kind==='html'?'quiet':'',p.kind==='html'?'disabled':'')}${p.kind==='html'?btn('Appearance','appearance')+btn('Share & home screen','share')+btn('Rebuild from plan','rebuild'):btn('Availability & app details','availability')}${btn('Export conversation','export-chat')}${btn('Delete project','delete','danger')}</div>${p.kind==='html'?'<p class="caption muted mt">HTML version restore requires new version storage. Current sharing and appearance remain available.</p>':''}`);}
function review(){state.projectId='trip';dialog('Review your change',`<span class="badge">Unapplied change</span><h3 class="mt">Add an optional note to expenses</h3><p class="muted mt">Changes the Expenses screen. Adds a text input and stores its value when you save an expense. Other screens and existing records stay the same.</p><details><summary>Check results — simulated</summary><p class="caption">Structure valid · sample save retains note · existing expense values unchanged.<br>These are illustrative results, not actual Android/model checks.</p></details><div class="actionbar">${btn('Preview change','review-preview')}${btn('Apply change','apply','primary')}</div><div class="row mt">${btn('Revise request','revise','quiet')}${btn('Discard proposal','discard','quiet danger')}</div>`);}
function history(){const p=project();dialog('Version history',p.versions.map((v,i)=>`<div class="historyrow"><div class="row between"><strong>${esc(v)}</strong>${i===0?'<span class="badge">Current</span>':''}</div><p class="caption muted">${i===0?'Most recent':'Earlier version'} · example revision</p>${i>0?btn('Inspect & restore','restore-review','quiet',`data-index="${i}"`):''}</div>`).join('')+`<p class="caption muted mt">Restoring the native definition keeps present app records. Full historical preview needs additional runtime support.</p>`);}
function appearance(){const p=project();state.appearanceDraft=structuredClone(p.appearance);appearanceDialog();}
function appearanceDialog(){const d=state.appearanceDraft;dialog('Appearance · next web build',`<span class="badge">Pending style choices</span><p class="caption muted mt">These choices affect the next HTML build. The current app remains available.</p><form data-form="appearance"><div class="field"><label for="layout">Layout</label><select id="layout" name="layout">${['Simple List','Tabbed','Card Grid','Journal','Dashboard'].map(t=>`<option ${t===d.layout?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="palette">Color palette</label><select id="palette" name="palette">${['Ocean','Forest','Sunset','Berry','Minimal','Midnight','Earth','Rose'].map(t=>`<option ${t===d.palette?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="app-icon">App icon</label><select id="app-icon" name="icon">${['Food','Book','Heart','Car','Fitness','Shopping','Home','Star','Travel','Pets','Work','School','Café','Gaming','Health','Nature','Camera','Music','Tasks','Timer','Map','Notes','Calendar','Search','Settings','Add'].map(t=>`<option ${t===d.icon?'selected':''}>${t}</option>`).join('')}</select></div><details><summary>App navigation</summary>${d.tabs.map((t,i)=>`<div class="row"><div class="grow">${field('Tab name','tab-'+i,t)}</div>${btn('Remove','remove-tab','quiet danger',`data-index="${i}" ${d.tabs.length<2?'disabled':''}`)}</div>`).join('')}${btn('Add tab','add-tab','',d.tabs.length>=5?'disabled':'')}<p class="caption muted mt">Tab-icon editing is specified for Android; this prototype only shows names.</p></details><div class="actionbar"><button type="submit" class="primary">Apply to next build</button>${btn('Reset draft','reset-appearance','quiet')}</div></form>`);}
function catalog(){dialog('Browse local models',`<p class="caption muted">The sizes and RAM tiers below come from the current app catalogue. RAM tiers are estimates. The first two models failed native-builder development trials; other build performance is unverified.</p>${[['Qwen3 0.6B · Q4_0','0.43 GB','4 GB'],['Qwen3 1.7B · Q8_0','1.83 GB','6 GB'],['Qwen3 4B · Q4_K_M','2.50 GB','8 GB'],['Gemma 4 E2B · Google','3.35 GB','8 GB'],['Qwen3 8B · Q4_K_M','5.03 GB','12 GB']].map(([n,s,r])=>`<div class="historyrow"><strong>${n}</strong><p class="caption muted">${s} download · ${r} estimated RAM tier</p>${btn('Simulate download','download','',`data-model="${n}"`)}</div>`).join('')}<p class="caption muted mt">No files are downloaded. Publisher source and full reliability guidance stay in the Android specification.</p>`);}
function featureDialog(index){const p=project(),f=p.features[index];dialog('Edit feature',`<form data-form="feature" data-index="${index}">${field('Feature name','feature-name',f.title)}${textfield('How it works','workflow',f.workflow)}${textfield('How we’ll check it — one check per line','checks',f.checks.join('\n'))}<div class="actionbar"><button type="submit" class="primary">Save draft</button>${btn('Remove feature','remove-feature','quiet danger',`data-index="${index}" ${p.features.length<2?'disabled':''}`)}</div></form>`);}
function startJob(type){const p=project();state.job={type,projectId:p.id,status:'running',connection:state.connection};state.review=false;state.queue=[];closeDialog();render();announce(type==='edit'?'Change preparation started.':'Build started.');}
function finishJob(){if(!state.job)return;const j=state.job,p=state.projects.find(p=>p.id===j.projectId);if(j.type==='edit'){state.review=true;}else{p.status='ready';p.versions=['Initial app'];}state.job=null;if(state.queue.length){p.messages.push(...state.queue.map(text=>({role:'user',text})),{role:'assistant',text:'Your follow-up requests were kept. In the app they would be handled after the current work.'});state.queue=[];}render();toast(j.type==='edit'?'Simulated change ready to review.':'Simulated build finished. Your app is ready.');}
app.addEventListener('input',e=>{if(e.target.dataset.draft){const type=e.target.dataset.draft;if(type==='new')state.newDraft=e.target.value;else if(type==='project')project().draft=e.target.value;else state.chats.find(c=>c.id===state.chatId).draft=e.target.value;}if(e.target.id==='app-search'){state.search=e.target.value;document.getElementById('library-list').innerHTML=libraryItems(state.empty?[]:state.projects.filter(p=>(p.name+' '+p.goal).toLowerCase().includes(state.search.toLowerCase())));}if(e.target.id==='suggestion')state.suggestion=e.target.checked;});
app.addEventListener('change',e=>{if(e.target.id==='cloud-model'){state.cloudModel=e.target.value;toast('Planning model saved for future requests.');}});
function saveGuidedDraft(){const f=app.querySelector('[data-form=guided]');if(!f)return;const d=new FormData(f);state.guided.name=String(d.get('guided-name')||'');state.guided.fields.forEach((x,i)=>x.name=String(d.get('guided-field-'+i)||''));state.guided.records=d.has('save-records');state.guided.search=state.guided.records&&d.has('search-records');state.guided.calculation=String(d.get('calculation'));}
function saveAppearanceDraft(){const f=modal.querySelector('[data-form=appearance]');if(!f)return;const d=new FormData(f),a=state.appearanceDraft;a.layout=String(d.get('layout'));a.palette=String(d.get('palette'));a.icon=String(d.get('icon'));a.tabs=a.tabs.map((t,i)=>String(d.get('tab-'+i)||t));}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,p=project();if(a.startsWith('tab-')){state.tab=a.slice(4);render();return;}if(a.startsWith('settings-')){state.settings=a.slice(9);if(state.route!=='settings')state.from=state.route;go('settings');return;}switch(a){
case 'apps':go('apps');break;case 'chats':go('chats');break;case 'create':go('new');break;case 'settings':state.from=state.route;state.settings='root';go('settings');break;
case 'activity':state.from=state.route;go('activity');break;
case 'back':if(state.route==='settings'&&state.settings!=='root'){state.settings=state.settings==='ai'?'root':'ai';render();}else if(state.route==='runner'){go('workspace');}else if(state.route==='general'){go('chats');}else if(state.route==='activity'||state.route==='settings'){go(state.from==='activity'?'apps':state.from);}else go('apps');break;
case 'open':state.projectId=b.dataset.id;state.toolTab='overview';go('runner');break;case 'open-current':state.toolTab='overview';go('runner');break;case 'edit':openProject(b.dataset.id);break;case 'cardmenu':state.projectId=b.dataset.id;menu(project());break;case 'menu':menu(p);break;
case 'search':state.searchOpen=true;render();document.getElementById('app-search')?.focus();break;case 'clear-search':state.search='';render();break;
case 'example':state.newDraft=b.dataset.text;render();document.getElementById('draft-new').focus();break;
case 'guided':state.from=state.route;go('guided');break;
case 'add-field':saveGuidedDraft();state.guided.fields.push({name:'New field',type:b.dataset.type});render();break;case 'remove-field':saveGuidedDraft();state.guided.fields.splice(+b.dataset.index,1);render();break;
case 'voice':dialog('Voice input',`<p>Local AI uses on-device dictation when available. Cloud mode may use your configured Android speech service.</p><form data-form="voice">${textfield('Simulated transcript — editable before sending','transcript','I want a simple app to track my expenses.')}<button class="primary" type="submit">Add to draft</button></form><p class="caption muted mt">This prototype does not request microphone access.</p>`);break;
case 'connection':dialog('Assistant connection',`<p><strong>${state.connection==='local'?'Local AI':'Cloud AI · Gemini'}</strong></p><p class="muted">${state.connection==='local'?(state.localModel?'Model installed. Reply test and build qualification are separate.':'Setup needed. Your draft and saved apps remain available.'):(state.keySaved?'Demo key saved. No live connection has been verified.':'Setup needed. Add your own key in the Android app.')}</p>${btn('AI & privacy settings','settings-ai','primary')}`);break;
case 'feature':featureDialog(+b.dataset.index);break;case 'add-feature':p.features.push({title:'New feature',workflow:'',checks:['']});render();featureDialog(p.features.length-1);break;case 'remove-feature':p.features.splice(+b.dataset.index,1);closeDialog();render();break;
case 'plan-details':dialog('App details',`<form data-form="details">${field('App name','name',p.name)}${textfield('What it does','goal',p.goal)}<details><summary>Who it is for</summary>${field('Audience','audience','You')}</details><button class="primary" type="submit">Save draft</button></form>`);break;
case 'screens':dialog('Screens & saved data',`<form data-form="screens">${textfield('Screens — one per line','screens',p.screens.join('\n'))}${textfield('Saved collections — one per line','data',p.data.join('\n'))}<button class="primary" type="submit">Save draft</button></form>`);break;
case 'suggestion':if(state.suggestion&&!p.features.some(f=>f.title==='Optional item note'))p.features.push({title:'Optional item note',workflow:'Keep a short note with each saved item.',checks:['The note is retained after reopening.']});state.suggestion=false;render();toast('Selections applied to the draft. No build started.');break;
case 'build':if(!p.name.trim()||p.features.some(f=>!f.title.trim()||!f.workflow.trim()||!f.checks.some(c=>c.trim()))){toast('Complete the feature name, workflow and at least one check before building.');break;}if(state.connection==='local'&&!state.localModel||state.connection==='cloud'&&!state.keySaved){dialog('Set up AI to build',`<p>Your draft is saved. Choose a connection, or build a manual tool without AI.</p>${btn('AI & privacy','settings-ai','primary')}${btn('Build manually','guided','quiet full mt')}`);break;}startJob('build');break;
case 'scope':dialog('Change on',`<p class="caption muted">Scope the requested change to one screen. Existing records stay separate from the definition.</p><div class="stack">${p.screens.map(s=>btn(s,'select-scope','',`data-screen="${esc(s)}"`)).join('')}</div><details><summary>Advanced scope</summary><label class="checkrow"><input type="checkbox" checked> Amount input</label><label class="checkrow"><input type="checkbox" checked> Save expense button</label><label class="checkrow"><input type="checkbox" checked> Allow new controls</label><p class="caption muted">Illustrative labels; the Android implementation must map these to real component IDs and persist scope.</p></details>`);break;
case 'select-scope':state.scope=b.dataset.screen;closeDialog();render();break;
case 'review':review();break;case 'review-preview':state.review=true;state.previewRecords=null;openProject('trip','preview');break;
case 'apply':p.note=true;p.versions.unshift('Added an optional expense note');state.review=false;state.previewRecords=null;closeDialog();render();toast('Simulated change applied. Existing expenses kept.');break;
case 'discard':state.review=false;state.previewRecords=null;closeDialog();render();toast('Proposal discarded. Current app unchanged.');break;
case 'revise':state.review=false;p.draft='Please change the proposal: ';closeDialog();state.tab='chat';render();document.getElementById('draft-project')?.focus();break;
case 'stop':state.job=null;closeDialog();render();toast('Work stopped. Draft and current app retained.');break;
case 'finish':finishJob();break;case 'fail':state.job.status='failed';render();toast('Simulated failure. Work has been retained.');break;case 'retry':state.job.status='running';render();toast('Retrying saved work in the simulation.');break;
case 'queue':dialog('Queued requests',state.queue.length?state.queue.map((q,i)=>`<p><strong>${i+1}.</strong> ${esc(q)}</p>`).join(''):'<p class="muted">No requests queued yet. You can keep typing while work runs.</p>');break;
case 'job-project':openProject(state.job.projectId);break;
case 'history':history();break;
case 'restore-review':dialog('Restore this version?',`<h3>${esc(p.versions[+b.dataset.index])}</h3><p class="muted mt">Restores the earlier native app definition as a new revision. Current saved expenses are retained.</p>${btn('Restore version','restore','primary')}${btn('Cancel','close-dialog','quiet')}`);break;
case 'restore':p.note=false;p.versions.unshift('Restored initial app definition');closeDialog();render();toast('Definition restored. Current sample records kept.');break;
case 'rename':dialog('Rename project',`<form data-form="rename">${field('Project name','name',p.name)}<button type="submit" class="primary">Rename</button></form>`);break;
case 'delete':dialog('Delete '+p.name+'?',`<p>This removes the app, conversation, saved records and version history. This prototype only deletes sample data.</p>${btn('Delete project','delete-confirm','danger')}${btn('Cancel','close-dialog','quiet')}`);break;
case 'delete-confirm':state.projects=state.projects.filter(x=>x.id!==p.id);state.projectId=state.projects[0]?.id||'';if(state.job?.projectId===p.id)state.job=null;go('apps');toast('Sample project deleted. Reset restores the examples.');break;
case 'appearance':appearance();break;case 'add-tab':saveAppearanceDraft();state.appearanceDraft.tabs.push('New tab');appearanceDialog();break;case 'remove-tab':saveAppearanceDraft();state.appearanceDraft.tabs.splice(+b.dataset.index,1);appearanceDialog();break;case 'reset-appearance':state.appearanceDraft={layout:'Simple List',palette:'Ocean',icon:'Star',tabs:['Home']};appearanceDialog();break;
case 'share':dialog('Share & home screen',`<p class="caption muted">Available for the saved HTML app. Records are not included in the HTML export.</p><div class="stack">${btn('Share HTML file','share-html')}${btn('Open in browser','browser')}${btn('Add shortcut','shortcut')}${btn('Add widget','widget')}</div>`);break;
case 'share-html':dialog('Share HTML file',`<p>The Android app would open its share chooser for the saved HTML file. Your records remain in the original app’s local storage.</p><p class="caption muted">Prototype only — no file is shared.</p>`);break;
case 'browser':dialog('Open in browser',`<p>The Android app would open an available browser for the exported HTML. Browser storage is separate from the embedded app’s storage.</p><p class="caption muted">Prototype only — no external app is launched.</p>`);break;
case 'shortcut':case 'widget':dialog(a==='shortcut'?'Add shortcut':'Add widget',`<p>The Android launcher would ask you to place this app on your home screen. ${a==='widget'?'Only supported summaries can be shown.':''}</p><p class="caption muted">The redesigned use link opens the app itself. This prototype does not change your launcher.</p>`);break;
case 'availability':dialog('App availability',`<p>Native app: local records, scoped edits and version restore are available in the current Android implementation.</p><p class="muted">Native appearance, portable bundles and launcher integration need new runtime support. They are excluded from this app’s actions until implemented.</p>`);break;
case 'export-chat':dialog('Export conversation',`<p>The existing Android text-export helper can share the conversation and legacy plan once wired to this menu. It is not an installable app or a records backup.</p><details><summary>Sample transcript</summary>${p.messages.map(m=>`<p class="caption"><strong>${m.role==='user'?'You':'BuildAI'}:</strong> ${esc(m.text)}</p>`).join('')}</details>`);break;
case 'rebuild':dialog('Rebuild from plan',`<p>Review requirements and appearance before rebuilding. The current legacy path has no version restore; safe HTML history retention is additional work.</p>${btn('Review plan','rebuild-plan','primary')}`);break;
case 'rebuild-plan':closeDialog();state.tab='plan';state.route='workspace';render();toast('Plan opened. Rebuild execution is specified for the Android migration.');break;
case 'use-local':state.connection='local';render();toast(state.localModel?'Local AI selected for future work.':'Local AI selected. Setup is still needed.');break;
case 'use-cloud':dialog('Use cloud AI?',`<p>Future requests will use Google’s API. Saved tools remain local. Running work keeps its existing connection.</p>${btn('Use cloud AI','confirm-cloud','primary')}`);break;
case 'confirm-cloud':state.connection='cloud';closeDialog();render();toast(state.keySaved?'Cloud AI selected for future requests.':'Cloud AI selected. Setup needs a key.');break;
case 'catalog':catalog();break;case 'download':state.operation='Downloading '+b.dataset.model;state.pendingModel=b.dataset.model;closeDialog();render();break;
case 'import-model':dialog('Import a local model',`<p>The Android file picker accepts a GGUF model and validates it before replacement. The current model is retained if import fails.</p>${btn('Simulate validated import','simulate-import','primary')}`);break;
case 'simulate-import':state.pendingModel='Imported GGUF model';state.operation='Validating imported model';closeDialog();render();break;
case 'test-model':state.operation='Testing a short local reply';state.pendingModel=null;render();break;
case 'finish-operation':if(state.pendingModel){state.localModel=state.pendingModel;state.pendingModel=null;toast('Model installed. Your selected AI connection did not change.');}else toast('Simulated reply test passed. App-building ability is not established.');state.operation=null;render();break;
case 'cancel-operation':state.operation=null;state.pendingModel=null;render();toast('Operation cancelled. Previous model retained.');break;
case 'remove-model':dialog('Remove local model?',`<p>Removes the model file. Your saved apps remain available. If Local AI is selected, it stays selected and will need setup.</p>${btn('Remove model','remove-model-confirm','danger')}`);break;
case 'remove-model-confirm':state.localModel=null;closeDialog();render();toast('Model removed. AI connection unchanged.');break;
case 'show-key':{const input=document.getElementById('demo-key');input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'Show':'Hide';break;}
case 'remove-key':dialog('Remove cloud key?',`<p>Cloud replies will need a key again. Local AI and saved apps remain available.</p>${btn('Remove key','remove-key-confirm','danger')}`);break;
case 'remove-key-confirm':state.keySaved=false;closeDialog();render();toast('Demo key removed. Saved apps remain available.');break;
case 'about':dialog('About this design',`<p>BuildAI is an Android personal-tool builder. This browser prototype is a proposal for its navigation and interactions.</p><p class="caption muted">The APK has not been changed by this audit. Current feature limits and implementation phases are in the companion specification.</p>`);break;
case 'new-chat':{const id='chat-'+Date.now();state.chats.unshift({id,name:'New chat',draft:'',messages:[]});state.chatId=id;go('general');break;}
case 'chat-open':state.chatId=b.dataset.id;go('general');break;
case 'chat-menu':state.chatId=b.dataset.id;dialog('Conversation options',`<form data-form="chat-rename">${field('Conversation name','name',state.chats.find(c=>c.id===state.chatId).name)}<button type="submit" class="primary">Rename</button></form>${btn('Delete conversation','chat-delete','quiet danger full mt')}`);break;
case 'chat-delete':dialog('Delete conversation?',`<p>Removes this sample chat and its messages.</p>${btn('Delete conversation','chat-delete-confirm','danger')}`);break;
case 'chat-delete-confirm':state.chats=state.chats.filter(c=>c.id!==state.chatId);go('chats');break;
case 'starters':dialog('Use a starter',`<p class="caption muted">Existing offline HTML templates. Their declared features replace the starter plan explicitly.</p><div class="pickergrid">${['Notes / journal','Task checklist','Habit tracker','Expense tracker','Calculator','Focus timer'].map(t=>btn(t,'starter','',`data-template="${t}"`)).join('')}</div>`);break;
case 'starter':dialog(b.dataset.template,`<p>A deterministic offline HTML starter, with the current template’s supported features. Android keeps the original custom draft when switching back.</p>${btn('Use this starter','starter-confirm','primary',`data-template="${esc(b.dataset.template)}"`)}<p class="caption muted mt">This prototype opens the legacy example to show its appearance and sharing flow. It does not implement all six starter apps.</p>`);break;
case 'starter-confirm':openProject('notes','plan');toast('Showing the legacy example for the '+b.dataset.template+' path.');break;
case 'tool-overview':state.toolTab='overview';render();break;case 'tool-expenses':state.toolTab='expenses';render();break;
case 'expense-menu':dialog('Expense options',`<p>Removing a record is protected by confirmation here. Reliable Undo needs a recoverable record API.</p>${btn('Remove expense','expense-remove','danger',`data-index="${b.dataset.index}" data-preview="${b.dataset.preview}"`)}`);break;
case 'expense-remove':{const records=b.dataset.preview==='true'?state.previewRecords:p.records;records.splice(+b.dataset.index,1);closeDialog();render();toast('Sample expense removed.');break;}
case 'close-dialog':closeDialog();break;case 'reset':location.reload();break;
}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const d=new FormData(form),p=project();switch(form.dataset.form){
case 'new':{const t=String(d.get('message')).trim();if(!t){toast('Describe what your app should do first.');return;}const id='draft-'+Date.now();state.projects.unshift({id,name:'New app',goal:t,kind:'native',status:'draft',icon:'apps',features:[{title:'Your main task',workflow:t,checks:['Try the main task with an example.']}],screens:['Home'],data:['Items'],answers:[],draft:'',messages:[{role:'user',text:t},{role:'assistant',text:'Here is an illustrative starting plan. In the Android app the assistant would clarify the requirements; no AI was called here.'}],records:[],budget:300,versions:[],appearance:{layout:'Simple List',palette:'Ocean',icon:'Star',tabs:['Home']}});state.empty=false;state.newDraft='';openProject(id);break;}
case 'project':{const t=String(d.get('message')).trim();if(!t){toast('Write a message first.');return;}if(state.job&&state.job.projectId!==p.id){toast('This prototype runs one job at a time. Finish the current simulation, then send this saved draft.');return;}p.draft='';if(state.job){state.queue.push(t);render();toast('Request queued after current work.');break;}p.messages.push({role:'user',text:t});if(p.status==='ready'&&p.kind==='native'){startJob('edit');}else{p.messages.push({role:'assistant',text:'Your request is kept in this project. This sample response is simulated; review or edit the plan to continue.'});render();}break;}
case 'general':{const t=String(d.get('message')).trim();if(!t)return;const c=state.chats.find(c=>c.id===state.chatId);c.messages.push({role:'user',text:t},{role:'assistant',text:'This is an example reply. The design keeps general conversations separate from app projects.'});c.draft='';render();break;}
case 'feature':{const f=p.features[+form.dataset.index];f.title=String(d.get('feature-name'));f.workflow=String(d.get('workflow'));f.checks=String(d.get('checks')).split('\n');closeDialog();render();toast('Draft saved, including incomplete fields. Build validation is separate.');break;}
case 'details':p.name=String(d.get('name'));p.goal=String(d.get('goal'));closeDialog();render();toast('App details saved to the draft.');break;
case 'screens':p.screens=String(d.get('screens')).split('\n').filter(Boolean);p.data=String(d.get('data')).split('\n').filter(Boolean);closeDialog();render();break;
case 'rename':if(!String(d.get('name')).trim()){toast('Enter a project name.');return;}p.name=String(d.get('name')).trim();closeDialog();render();break;
case 'chat-rename':state.chats.find(c=>c.id===state.chatId).name=String(d.get('name')).trim()||'Chat';closeDialog();render();break;
case 'appearance':saveAppearanceDraft();p.appearance=structuredClone(state.appearanceDraft);closeDialog();render();toast('Appearance saved for the next web build. Current app unchanged.');break;
case 'key':if(!String(d.get('key')).trim()){toast('Enter sample text first.');return;}state.keySaved=true;form.reset();render();toast('Demo key state saved. Actual text discarded.');break;
case 'voice':{const t=String(d.get('transcript'));if(state.route==='new')state.newDraft=(state.newDraft+' '+t).trim();else if(state.route==='general'){const c=state.chats.find(c=>c.id===state.chatId);c.draft=(c.draft+' '+t).trim();}else p.draft=(p.draft+' '+t).trim();closeDialog();render();toast('Transcript added to your draft. Review before sending.');break;}
case 'expense':{const name=String(d.get('expense')).trim(),raw=String(d.get('amount')).trim(),amount=Number(raw);if(!name||!raw||!Number.isFinite(amount)||amount<0){state.expenseError='Enter a name and a non-negative amount.';render();return;}const preview=state.route!=='runner',records=preview?state.previewRecords:p.records;records.push({name,amount,category:String(d.get('category')),note:String(d.get('record-note')||'')});state.expenseError='';render();toast(preview?'Sample preview updated. Current app records unchanged.':'Sample expense saved.');break;}
case 'note':{const records=state.route==='runner'?p.records:(state.previewRecords??=p.records.map(r=>({...r})));records.push({name:String(d.get('note'))});render();toast('Sample note saved.');break;}
case 'guided':saveGuidedDraft();if(!state.guided.name.trim()||state.guided.fields.some(f=>!f.name.trim())){toast('Name the app and each field.');return;}dialog('Manual draft preview',`<h3>${esc(state.guided.name)}</h3><p class="muted mt">Fields: ${esc(state.guided.fields.map(f=>f.name+' ('+f.type+')').join(', '))}</p><p>Saved records: ${state.guided.records?'Yes':'No'}<br>Search: ${state.guided.search?'Yes':'No'}<br>Calculation: ${esc(state.guided.calculation)}</p><p class="caption muted">In Android the existing guided composer validates and publishes the native definition. No app is actually published from this browser prototype.</p>${btn('Keep editing','close-dialog','primary')}`);break;
}});
document.addEventListener('keydown',e=>{if(modal.firstChild){if(e.key==='Escape'){e.preventDefault();closeDialog();return;}if(e.key==='Tab'){const els=[...modal.querySelectorAll('button:not(:disabled),input,textarea,select,a[href],summary')].filter(x=>x.getClientRects().length);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}}else if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const ts=['chat','plan','preview'],i=ts.indexOf(state.tab);state.tab=ts[(i+(e.key==='ArrowRight'?1:2))%3];render();document.getElementById('tab-'+state.tab).focus();}});
document.getElementById('large').addEventListener('change',e=>document.documentElement.classList.toggle('large-text',e.target.checked));
document.getElementById('scenario').addEventListener('change',e=>{state.job=null;state.review=false;state.empty=false;state.operation=null;state.search='';state.searchOpen=false;switch(e.target.value){case 'first':state.empty=true;go('apps');break;case 'draft':openProject('routine','plan');break;case 'review':state.review=true;openProject('trip','chat');break;case 'failure':state.job={type:'build',projectId:'routine',status:'failed',connection:state.connection};state.from='apps';go('activity');break;case 'setup':state.localModel=null;state.keySaved=false;state.connection='local';state.settings='ai';state.from='apps';go('settings');break;default:go('apps');}});
render();
</script>
</body>
